<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Marco Nagy — Flutter Developer portfolio.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Marco Nagy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Marco Nagy — Flutter Developer</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
      This is the real splash screen on web. It is plain HTML/CSS because it
      must be on screen *before* the Flutter engine and app bundle have
      downloaded — a Flutter widget cannot cover that window by definition.
      Colours mirror AppColorTheme.navy so the handoff to the app is seamless.
    */
    :root {
      --navy-deep: #050B1B;
      --navy-lift: #122350;
      --accent: #4CC9F0;
      --on-navy: #F7F9FC;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: var(--navy-deep);
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--navy-deep) 0%, var(--navy-lift) 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 400ms ease-out;
    }

    /* Set by JS once Flutter paints, then the node is removed entirely. */
    #splash.is-done {
      opacity: 0;
      pointer-events: none;
    }

    #splash-name {
      color: var(--on-navy);
      font-size: clamp(24px, 4vw, 40px);
      font-weight: 800;
      letter-spacing: 0.5px;
      opacity: 0;
      animation: splash-fade-in 600ms ease-out forwards;
    }

    #splash-track {
      margin-top: 18px;
      width: min(240px, 60vw);
      height: 2px;
      background-color: rgba(247, 249, 252, 0.15);
      overflow: hidden;
    }

    #splash-bar {
      height: 100%;
      width: 0;
      background-color: var(--accent);
      /*
        Real byte-level download progress is not exposed to the page, so the
        bar eases toward 90% and is completed by JS on the first frame. It
        tracks readiness honestly at the only two moments that are knowable:
        start and done.
      */
      animation: splash-progress 2.4s cubic-bezier(0.1, 0.7, 0.2, 1) forwards;
    }

    #splash-bar.is-complete {
      width: 100% !important;
      animation: none;
      transition: width 220ms ease-out;
    }

    @keyframes splash-fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }

    @keyframes splash-progress {
      from { width: 0; }
      to   { width: 90%; }
    }

    @media (prefers-reduced-motion: reduce) {
      #splash-name { animation: none; opacity: 1; }
      #splash-bar { animation: none; width: 90%; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div id="splash-name">Marco Nagy Louka</div>
    <div id="splash-track"><div id="splash-bar"></div></div>
  </div>

  <script>
    // Flutter fires this once it has painted its first frame, which is the
    // only reliable moment the app is actually visible.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      var bar = document.getElementById('splash-bar');
      if (!splash) return;

      if (bar) bar.classList.add('is-complete');

      // Let the bar finish before fading, then drop the node so it can never
      // intercept a pointer event over the app.
      window.setTimeout(function () {
        splash.classList.add('is-done');
        window.setTimeout(function () { splash.remove(); }, 400);
      }, 220);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
