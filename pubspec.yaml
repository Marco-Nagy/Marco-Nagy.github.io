name: marco_portfolio
description: "Marco Nagy Louka — Flutter Developer portfolio (mobile + web). Content lives in Firestore and is edited from the debug-only admin; media is hosted on Cloudinary."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  bloc:
  flutter_bloc:

  # DI
  get_it:
  injectable:

  # Brand logos ship as SVG, so they stay sharp at any badge size
  flutter_svg:

  # UI / responsiveness
  flutter_screenutil:

  # Content backend: Firestore holds one bundle document that every visitor
  # reads; auth gates writes to the single owner account
  firebase_core:
  cloud_firestore:
  firebase_auth:

  # Cloudinary uploads are a plain multipart POST, so no SDK is needed
  http:

  # SHA-1 for signing Cloudinary uploads — the account uses signed uploads
  # (api_key + api_secret via --dart-define), not an unsigned preset.
  crypto:

  # Local storage — now the cache in front of Firestore, not the source of
  # truth, and the offline fallback when a fetch fails
  shared_preferences:

  # External links: CV pdf, GitHub, LinkedIn, mailto
  url_launcher:

  # Debug-only image picking for admin forms. Kept alongside file_picker for
  # its maxWidth/maxHeight/imageQuality resize, which file_picker has no
  # equivalent for — that resize is what stops a raw phone photo reaching the
  # crop editor at full resolution and making it lag.
  image_picker:

  # Picks anything that is not an image — the CV PDF. image_picker is
  # images/video only and cannot open a PDF at all.
  file_picker:

  # Project media: mp4/webm screen recordings. Flutter composites these,
  # so they survive the hover reveal's rotation
  video_player:

  # YouTube walkthroughs. A platform view, so it is confined to flat,
  # untransformed surfaces — never inside a rotated preview
  youtube_player_iframe:

  # Models
  freezed_annotation:
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner:
  freezed:
  json_serializable:
  injectable_generator:
  bloc_test:

  # Generates platform app icons from assets/icon/app_icon.png
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - translations/
    - assets/cv/
    - assets/content/
    - assets/images/
    - assets/projects/
    - assets/tech/
    - assets/icon/

# {MN} monogram — Flutter blue braces on deep navy, matching the intro
# animation lockup. Run `dart run flutter_launcher_icons` after editing.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: "ic_launcher"
  min_sdk_android: 21
  adaptive_icon_background: "#0D1319"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0D1319"
    theme_color: "#0D1319"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
